apis:
- aid: medical-director:telstra-health-smart-api-plus
  name: Telstra Health Smart API+
  description: >-
    FHIR-native integration gateway from Telstra Health that provides a single, standardized
    interface for approved technology partners to exchange data with MedicalDirector Helix
    cloud general-practice patient-management software (and, on a case-by-case basis,
    MedicalDirector Clinical). Marketed as a build-once gateway that removes the need for
    bespoke, platform-specific integrations across Telstra Health's primary-care ecosystem.
    Access is gated behind a partner agreement; no public FHIR CapabilityStatement,
    metadata endpoint, or OpenAPI is served anonymously, and the specific FHIR version and
    auth scheme are not disclosed on public pages.
