name: MedicalDirector
kind: company
description: >-
  MedicalDirector is an Australian clinical and practice-management software provider,
  owned by Telstra Health, that has served general practices, specialists, and day
  hospitals across Australia for more than 25 years. Its product family includes Helix
  (a cloud-based combined clinical and practice-management system), Clinical and Pracsoft
  (on-premise clinical and practice-management software), Bluechip (specialist practice
  management), and Day Surgery. Alongside Best Practice, MedicalDirector is one half of
  the dominant Australian GP-software duopoly. Its programmatic surface is delivered
  through Telstra Health Smart API+, a FHIR-native integration gateway that lets approved
  technology partners exchange data with MedicalDirector Helix (and, on a case-by-case
  basis, MedicalDirector Clinical) without bespoke, platform-specific integrations. Smart
  API+ is a gated, partner-onboarded API: it is publicly announced and described but has
  no self-serve public developer portal, and no FHIR CapabilityStatement or OpenAPI is
  published anonymously. Access is granted through a partner agreement, and the underlying
  FHIR version and SMART-on-FHIR auth specifics are not disclosed on public pages.
